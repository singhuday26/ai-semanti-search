version: '3.8'
services:
  semantic-search:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount data/ so the built index persists across restarts.
      # Run build_index.py inside the container ONCE after first
      # startup: docker exec -it semantic-search python scripts/build_index.py
      - ./data:/app/data
    environment:
      - CACHE_THRESHOLD=0.85
    # --workers 1 is REQUIRED for SemanticCache state coherence
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
